name: Apps

# Builds the Lain OS apps that live in this repository: the Android app
# (apps/mobile, a Capacitor shell around chat.lain-os.com) and the browser
# extension (apps/extension, the Lain side panel).
#
# Push a tag and both land on a public GitHub release:
#
#   git tag app-v1.1.0 && git push origin app-v1.1.0
#
# A manual run (Actions tab) builds the same artifacts and publishes nothing.
# File names carry no version, so this link never moves:
#   https://github.com/lain-labs/os/releases/latest/download/LainOS.apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    outputs:
      signed: ${{ steps.signing.outputs.signed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Sync web assets
        run: npm run sync:android

      # The same key has to sign every release forever, or an update means an
      # uninstall. apps/mobile/scripts/make-keystore.sh makes it and uploads the
      # four secrets; without them the debug APK stays a workflow artifact.
      - name: Signing material
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android release unavailable::Signing is not configured. The debug APK stays in workflow artifacts and will not be published."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/lainos-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=lainos-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          LAIN_VERSION_NAME: ${{ steps.version.outputs.name }}
          LAIN_VERSION_CODE: ${{ steps.version.outputs.code }}
        working-directory: apps/mobile/android
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # Only the signed release uses the public download name LainOS.apk.
      - name: Name the APK
        id: apk
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk LainOS.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk LainOS-debug.apk
          fi
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "artifact=release-android" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=debug-android" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: apps/mobile/LainOS*.apk
          if-no-files-found: error

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Version from tag
        if: github.ref_type == 'tag'
        run: npm version "${GITHUB_REF_NAME#app-v}" --no-git-tag-version --allow-same-version

      - name: Pack
        run: npm run zip

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: apps/extension/LainOS-extension.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, extension]
    if: ${{ always() && github.ref_type == 'tag' && needs.extension.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Collect builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: builds

      - name: Checksums
        working-directory: builds
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .

      - name: Release notes
        run: |
          APK_NOTE="_This release has no Android APK (signing is not configured)._"
          if [ -f builds/LainOS.apk ]; then
            APK_NOTE="**Android** — \`LainOS.apk\`: the chat with Lain as an app. Share any text or link to it from another app and it opens a new chat with that text typed in. Android asks once to allow installs from your browser."
          fi
          cat > notes.md <<EOF
          $APK_NOTE

          **Browser** — \`LainOS-extension.zip\` for Chrome, Brave and Edge: a side panel with Lain next to any page, "Ask Lain" on selected text, and a token lookup for a contract address you select. Unzip, open \`chrome://extensions\`, turn on Developer mode, *Load unpacked*. It talks to your own Lain OS API key.

          Verify downloads against \`SHA256SUMS.txt\`.
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: builds/*
